<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Retro RPG Resume</title>
    <!-- Stable Canvas Engine Link -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111122; /* Dark retro canvas background */
            overflow: hidden;
            font-family: monospace;
        }
        #resume-link {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff0055;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border: 3px solid white;
            z-index: 100;
        }
    </style>
</head>
<body>

    <a href="#" id="resume-link" target="_blank">📄 View Standard PDF Resume</a>

    <script>
        // Start Canvas Engine without configuration bugs
        kaplay({
            width: 800,
            height: 600,
            letterbox: true, 
        });

        setGravity(0);

        // Map Layout (# = Red Wall blocks, N = Green Info Desks)
        addLevel([
            "####################",
            "#                  #",
            "#   N          N   #",
            "#                  #",
            "#                  #",
            "#        P         #",
            "#                  #",
            "#   N          N   #",
            "#                  #",
            "####################",
        ], {
            tileWidth: 40,
            tileHeight: 40,
            tiles: {
                "#": () => [rect(40, 40), color(200, 50, 50), area(), body(), isStatic(), "wall"],
                "N": () => [rect(40, 40), color(50, 200, 50), area(), body(), isStatic(), "resume-node"],
            },
        });

        // Player (Blue Square)
        const player = add([
            rect(32, 32),
            color(50, 100, 250),
            pos(400, 300), 
            area(),         
            body(),         
            "player",       
        ]);

        // Smooth Movement Key Controls
        const SPEED = 220;
        onKeyDown("left", () => { player.move(-SPEED, 0); });
        onKeyDown("right", () => { player.move(SPEED, 0); });
        onKeyDown("up", () => { player.move(0, -SPEED); });
        onKeyDown("down", () => { player.move(0, SPEED); });

        // Text Dialogue Box Layout UI
        const dialogBox = add([
            rect(760, 100, { radius: 8 }),
            pos(20, 480),
            color(0, 0, 0),
            outline(4, rgb(255, 255, 255)),
            fixed()
        ]);

        const dialogText = add([
            text("Use Arrow Keys to move! Walk up to colored blocks to read.", { size: 16, width: 720 }),
            pos(40, 500),
            color(255, 255, 255),
            fixed()
        ]);

        // Trigger text messages when hitting a green desk block
        player.onCollide("resume-node", (node) => {
            if(node.pos.x < 300 && node.pos.y < 300) {
                dialogText.text = "🎯 MY SKILLS:\nCoding, Design, Web Development.";
            } 
            else if (node.pos.x > 300 && node.pos.y < 300) {
                dialogText.text = "💼 EXPERIENCE:\nYour Work History goes here!";
            } 
            else if (node.pos.x < 300 && node.pos.y > 300) {
                dialogText.text = "🚀 PROJECTS:\nWebsites or tools you have built.";
            } 
            else {
                dialogText.text = "📞 CONTACT:\nPut your email here.";
            }
        });

        player.onCollideEnd("resume-node", () => {
            dialogText.text = "Keep exploring to learn more!";
        });
    </script>
</body>
</html>
